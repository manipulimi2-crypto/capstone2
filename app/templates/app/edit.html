<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
    <a class="navbar-brand" href="#">CRUDPROJECT</a>
    </nav>
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-4">
                 <h2 class="bg-dark text-white p-3 text-center">Update Student Details</h2>
                 <form action="/update/{{d.id}}" method="post">{% csrf_token %}
                    <div>
                        <input type="text" class="form-control" placeholder="enter student name" name="name" value="{{d.name}}">
                    </div>
                    <div>
                        <input type="text" class="form-control mt-2" placeholder="enter the email" name="email" value="{{d.email}}">
                    </div>
                    <div>
                        <input type="number" class="form-control mt-2" placeholder="enter student age" name="age" value="{{d.age}}">
                    </div>
                        <select name="gender" value="{{d.gender}}" id="gender" class="form-select mt-2">
                           <option value="">Select Gender</option>
                           <option value="Male">Male</option>
                           <option value="Female">Female</option>
                           <option value="Other">Other</option>
                        </select>
                    <div>
                        <button class="form-control btn btn-success mt-2">submit</button>
                    </div>
                 </form>
            </div>
        </div>   
    </div>
</body>
</html>
